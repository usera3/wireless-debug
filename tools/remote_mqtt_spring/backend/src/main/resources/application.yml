server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wireless-debug-remote-control
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wireless_debug}
    username: ${SPRING_DATASOURCE_USERNAME:wireless_debug}
    password: ${SPRING_DATASOURCE_PASSWORD:wireless_debug}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
    token-ttl: ${APP_TOKEN_TTL:8h}
    cookie-secure: ${APP_COOKIE_SECURE:false}
  mqtt:
    enabled: ${APP_MQTT_ENABLED:true}
    url: ${APP_MQTT_URL:tcp://localhost:1883}
    namespace: ${APP_MQTT_NAMESPACE:wireless-debug}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
