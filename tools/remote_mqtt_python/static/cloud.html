<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMCC · 设备调试台</title>
  <style>
    :root { color-scheme: light; font: 14px Inter, "Segoe UI", "Microsoft YaHei", sans-serif; color: #15273c; background: #f4f6f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 32px; background: #142438; color: white; }
    .brand { display: flex; align-items: center; gap: 24px; }
    .wordmark { position: relative; font-size: 31px; font-weight: 750; font-style: italic; letter-spacing: -1.4px; }
    .wordmark::after { content: ''; position: absolute; top: 3px; right: -11px; width: 7px; height: 7px; background: #2cc3d7; transform: skewX(-15deg); }
    .product { font-size: 16px; font-weight: 500; }
    header a { color: #d8e0eb; text-decoration: none; }
    main { max-width: 1440px; margin: auto; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 23px; font-weight: 600; }
    .hint { margin: 0; color: #748294; font-size: 13px; }
    .toolbar { display: flex; gap: 12px; margin: 24px 0 16px; }
    input, select, button, .entry { min-height: 40px; border: 1px solid #dbe2eb; border-radius: 5px; padding: 0 12px; font: inherit; }
    input { flex: 1; min-width: 0; max-width: 420px; }
    input, select { background: white; color: #22374e; }
    button, .entry { background: #117d99; color: white; border-color: #117d99; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button:hover, .entry:hover { background: #0d6b84; }
    :focus-visible { outline: 2px solid #117d99; outline-offset: 3px; }
    #message { margin: 16px 0; color: #748294; }
    #message[role="alert"] { color: #b42336; padding: 14px 16px; border: 1px solid #f0cdd3; border-radius: 5px; background: #fff; }
    #devices { border: 1px solid #e1e7ee; border-radius: 5px; background: white; overflow: hidden; }
    .columns, .device { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(180px, 1.2fr) 90px minmax(180px, 1.4fr) 120px; gap: 16px; align-items: center; padding: 18px 20px; }
    .columns { background: #f8fafc; color: #748294; font-size: 12px; }
    .device { border-top: 1px solid #e1e7ee; }
    .name { font-weight: 600; }
    .id, .address { overflow-wrap: anywhere; font-size: 13px; line-height: 1.7; }
    .state { display: inline-block; padding: 4px 9px; border-radius: 4px; background: #f0f2f5; color: #596679; font-size: 12px; }
    .state.online { background: #e8f7f0; color: #146d4b; }
    .state.offline { background: #fff0f1; color: #ab3545; }
    .entry { display: inline-flex; justify-content: center; align-items: center; text-decoration: none; font-size: 13px; white-space: nowrap; }
    .mobile-label { display: none; }
    @media (max-width: 900px) {
      main { padding: 24px 18px; }
      header { padding: 20px 18px; }
      .columns { display: none; }
      .device { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 20px 16px; }
      .device:first-of-type { border-top: 0; }
      .id, .address { grid-column: 1 / -1; }
      .device .state-wrap { grid-column: 2; grid-row: 1; }
      .entry { grid-column: 1 / -1; }
      .mobile-label { display: inline; color: #748294; margin-right: 8px; }
    }
    @media (max-width: 480px) {
      .brand { gap: 20px; }
      .wordmark { font-size: 26px; }
      .product { font-size: 14px; }
      .toolbar { flex-wrap: wrap; }
      input { flex-basis: 100%; max-width: none; }
      select { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="wordmark">GMCC</span><span class="product">设备调试台</span></div>
    <a href="/logout">退出登录</a>
  </header>
  <main>
    <h1>设备列表</h1>
    <p class="hint">选择设备，打开调试控制台</p>
    <div class="toolbar">
      <input id="search" type="search" aria-label="搜索设备" placeholder="搜索设备名 / 设备 ID / IP">
      <select id="state" aria-label="在线状态"><option value="all">全部状态</option><option value="online">在线</option><option value="offline">离线</option></select>
      <button id="refresh" type="button">刷新</button>
    </div>
    <p id="message" role="status" aria-live="polite">正在加载设备...</p>
    <div id="devices" aria-label="设备列表"></div>
  </main>
  <script>
    (() => {
      const list = document.getElementById('devices');
      const message = document.getElementById('message');
      const refresh = document.getElementById('refresh');
      const search = document.getElementById('search');
      const state = document.getElementById('state');
      let devices = [];
      let available = false;
      let pending = false;
      const text = value => value == null ? '' : String(value);
      function element(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (value != null) node.textContent = value;
        return node;
      }
      function render() {
        list.replaceChildren();
        if (!available) return;
        const query = search.value.trim().toLocaleLowerCase();
        const rows = devices.filter(device => {
          const matchesState = state.value === 'all' || device.cloud_state === state.value;
          return matchesState && [device.display_name, device.device_id, device.sta_ip, device.ap_ip].some(value => text(value).toLocaleLowerCase().includes(query));
        });
        message.setAttribute('role', 'status');
        message.textContent = rows.length ? rows.length + ' 台设备' : devices.length ? '没有匹配的设备' : '暂无设备';
        if (!rows.length) return;
        const columns = element('div', 'columns');
        columns.setAttribute('aria-hidden', 'true');
        for (const heading of ['设备名', '设备 ID', '在线状态', '网络地址', '入口']) columns.append(element('span', '', heading));
        list.append(columns);
        for (const device of rows) {
          const row = element('article', 'device');
          const id = text(device.device_id);
          row.append(element('div', 'name', text(device.display_name) || id || '未命名设备'));
          const idNode = element('div', 'id');
          idNode.append(element('span', 'mobile-label', '设备 ID'), document.createTextNode(id || '--'));
          row.append(idNode);
          const cloudState = device.cloud_state === 'online' ? 'online' : device.cloud_state === 'offline' ? 'offline' : 'unknown';
          const stateNode = element('div', 'state-wrap');
          stateNode.append(element('span', 'state ' + cloudState, cloudState === 'online' ? '在线' : cloudState === 'offline' ? '离线' : '未知'));
          row.append(stateNode);
          const address = element('div', 'address');
          address.append(element('div', '', 'STA: ' + (text(device.sta_ip) || '--')), element('div', '', 'AP: ' + (text(device.ap_ip) || '--')));
          row.append(address);
          if (id) {
            const link = element('a', 'entry', '打开控制台');
            link.setAttribute('href', '/remote/' + encodeURIComponent(id) + '/orig/i.html');
            row.append(link);
          } else row.append(element('span', '', '缺少设备 ID'));
          list.append(row);
        }
      }
      async function load() {
        if (pending) return;
        pending = true;
        refresh.disabled = true;
        try {
          const response = await fetch('/api/devices', { cache: 'no-store', credentials: 'same-origin' });
          if (response.status === 401 || response.status === 403) {
            location.href = '/login?next=' + encodeURIComponent(location.pathname + location.hash);
            return;
          }
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          if (!Array.isArray(data.devices)) throw new Error('设备列表格式无效');
          devices = data.devices.filter(device => device && typeof device === 'object');
          available = true;
          render();
        } catch (error) {
          available = false;
          devices = [];
          list.replaceChildren();
          message.setAttribute('role', 'alert');
          message.textContent = '设备列表加载失败，请刷新重试。' + (error instanceof Error ? ' ' + error.message : '');
        } finally {
          pending = false;
          refresh.disabled = false;
        }
      }
      search.addEventListener('input', render);
      state.addEventListener('change', render);
      refresh.addEventListener('click', load);
      load();
      window.setInterval(load, 5000);
    })();
  </script>
</body>
</html>
