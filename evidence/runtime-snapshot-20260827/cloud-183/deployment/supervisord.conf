[unix_http_server]
file=/apps/run/wireless-debug-cloud/supervisor.sock
chmod=0700

[supervisord]
logfile=/apps/logs/wireless-debug-cloud/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=/apps/run/wireless-debug-cloud/supervisord.pid
childlogdir=/apps/logs/wireless-debug-cloud
nodaemon=false
minfds=1024
minprocs=200
environment=PATH="/apps/.local/share/micromamba/envs/wireless-debug/bin:/apps/.local/share/micromamba/envs/wireless-debug/sbin:/usr/local/bin:/usr/bin:/bin"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///apps/run/wireless-debug-cloud/supervisor.sock

[program:postgres]
command=/apps/.local/share/micromamba/envs/wireless-debug/bin/postgres -D /apps/dbdat/wireless-debug-cloud/postgres -h 127.0.0.1 -p 5432 -k /apps/run/wireless-debug-cloud/postgres
directory=/apps/dbdat/wireless-debug-cloud/postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/apps/logs/wireless-debug-cloud/postgres.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:mosquitto]
command=/apps/.local/share/micromamba/envs/wireless-debug/sbin/mosquitto -c /apps/conf/wireless-debug-cloud/mosquitto.conf
directory=/apps/dbdat/wireless-debug-cloud/mosquitto
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/apps/logs/wireless-debug-cloud/mosquitto.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:cloud]
command=/apps/svr/wireless-debug-cloud/bin/run-cloud.sh
directory=/apps/svr/wireless-debug-cloud/app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=60
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/apps/logs/wireless-debug-cloud/cloud.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
